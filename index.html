<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Фотофиксация работ</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="btn-back" title="Назад">‹</button>
    <div class="topbar-title" id="topbar-title">Объекты</div>
    <div class="topbar-right">
      <span class="role-badge" id="role-badge"></span>
      <button class="icon-btn" id="btn-logout" title="Выйти">⏻</button>
    </div>
  </header>

  <main>
    <!-- ВХОД / РОЛЬ -->
    <section class="screen" id="screen-login">
      <div class="login-box">
        <div class="login-logo">📸</div>
        <div class="login-title">Фотофиксация работ</div>
        <div class="login-sub">Фото «до / во время / после» с данными об объекте и видах работ</div>
        <form id="login-form">
          <div class="role-toggle">
            <label><input type="radio" name="role" value="worker" checked><span>👷 Работник</span></label>
            <label><input type="radio" name="role" value="manager"><span>🧑‍💼 Менеджер</span></label>
          </div>
          <div class="field">
            <label for="login-name">Ваше имя</label>
            <input type="text" id="login-name" placeholder="Например, Иван" autocomplete="name">
          </div>
          <button type="submit" class="btn">Войти</button>
        </form>
      </div>
    </section>

    <!-- СПИСОК ОБЪЕКТОВ -->
    <section class="screen" id="screen-objects" hidden>
      <div class="sub-bar">
        <button class="btn secondary" id="worktypes-btn" hidden>🛠 Справочник работ</button>
      </div>
      <div id="objects-list"></div>
      <button class="fab" id="btn-new-object" title="Новый объект">+</button>
    </section>

    <!-- ФОРМА ОБЪЕКТА -->
    <section class="screen" id="screen-object-form" hidden>
      <form id="object-form">
        <div class="field">
          <label for="obj-address">Адрес *</label>
          <input type="text" id="obj-address" placeholder="ул. Ленина, д. 10" required>
        </div>
        <div class="grid3">
          <div class="field">
            <label for="obj-apartment">Квартира</label>
            <input type="text" id="obj-apartment" placeholder="12">
          </div>
          <div class="field">
            <label for="obj-floor">Этаж</label>
            <input type="text" id="obj-floor" placeholder="3">
          </div>
          <div class="field">
            <label for="obj-entrance">Подъезд</label>
            <input type="text" id="obj-entrance" placeholder="2">
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label for="obj-customer">Заказчик</label>
            <input type="text" id="obj-customer" placeholder="ФИО">
          </div>
          <div class="field">
            <label for="obj-phone">Телефон</label>
            <input type="tel" id="obj-phone" placeholder="+7 ...">
          </div>
        </div>
        <div class="field">
          <label for="obj-comment">Комментарий</label>
          <textarea id="obj-comment" placeholder="Особенности объекта, примечания…"></textarea>
        </div>
        <div class="field">
          <label>Местоположение (авто)</label>
          <div class="grid2">
            <input type="text" id="obj-lat" placeholder="Широта" readonly>
            <input type="text" id="obj-lng" placeholder="Долгота" readonly>
          </div>
          <button type="button" class="btn secondary" id="btn-locate" style="margin-top:8px">📍 Определить</button>
        </div>
        <button type="submit" class="btn">Сохранить объект</button>
      </form>
    </section>

    <!-- СПИСОК ЗАКАЗОВ -->
    <section class="screen" id="screen-orders" hidden>
      <div class="summary">
        <div class="obj-title" id="orders-object-title">Объект</div>
        <div class="obj-sub" id="orders-object-sub"></div>
      </div>
      <div id="orders-list"></div>
      <button class="btn" id="btn-new-order">+ Новый заказ</button>
    </section>

    <!-- ФОРМА ЗАКАЗА -->
    <section class="screen" id="screen-order-form" hidden>
      <form id="order-form">
        <div class="field">
          <label>Виды работ</label>
          <div class="checkbox-group" id="order-worktypes"></div>
        </div>
        <div class="field">
          <label for="order-worker">Исполнитель</label>
          <input type="text" id="order-worker" placeholder="ФИО работника">
        </div>
        <div class="grid2">
          <div class="field">
            <label for="order-date">Дата</label>
            <input type="date" id="order-date">
          </div>
          <div class="field">
            <label for="order-status">Статус</label>
            <select id="order-status">
              <option>В работе</option>
              <option>Завершён</option>
              <option>Приостановлен</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="order-comment">Комментарий к заказу</label>
          <textarea id="order-comment" placeholder="Что делаем, объём работ…"></textarea>
        </div>
        <button type="submit" class="btn">Создать заказ</button>
      </form>
    </section>

    <!-- КАРТОЧКА ЗАКАЗА: ФОТО ПО ЭТАПАМ -->
    <section class="screen" id="screen-order" hidden>
      <div class="summary" id="od-object"></div>
      <div class="summary" id="od-order"></div>

      <div class="section-title">Фото по этапам</div>

      <div class="stage" id="stage-before">
        <div class="stage-head">
          <span class="stage-dot before"></span>
          <span class="stage-title">До работ</span>
          <span class="stage-count"></span>
        </div>
        <div class="stage-photos"></div>
        <div class="shot-row">
          <button type="button" class="shot-btn" data-stage="before" data-mode="camera">📷 Сделать фото</button>
          <button type="button" class="shot-btn" data-stage="before" data-mode="gallery">🖼 Из галереи</button>
        </div>
      </div>

      <div class="stage" id="stage-during">
        <div class="stage-head">
          <span class="stage-dot during"></span>
          <span class="stage-title">Во время работ</span>
          <span class="stage-count"></span>
        </div>
        <div class="stage-photos"></div>
        <div class="shot-row">
          <button type="button" class="shot-btn" data-stage="during" data-mode="camera">📷 Сделать фото</button>
          <button type="button" class="shot-btn" data-stage="during" data-mode="gallery">🖼 Из галереи</button>
        </div>
      </div>

      <div class="stage" id="stage-after">
        <div class="stage-head">
          <span class="stage-dot after"></span>
          <span class="stage-title">После работ</span>
          <span class="stage-count"></span>
        </div>
        <div class="stage-photos"></div>
        <div class="shot-row">
          <button type="button" class="shot-btn" data-stage="after" data-mode="camera">📷 Сделать фото</button>
          <button type="button" class="shot-btn" data-stage="after" data-mode="gallery">🖼 Из галереи</button>
        </div>
      </div>

      <button class="btn" id="btn-export">⬇️ Экспорт архива (фото + отчёт)</button>
    </section>

    <!-- СПРАВОЧНИК ВИДОВ РАБОТ -->
    <section class="screen" id="screen-worktypes" hidden>
      <form id="add-worktype-form" class="field" style="display:flex;gap:8px">
        <input type="text" id="new-worktype" placeholder="Новый вид работ" style="flex:1">
        <button type="submit" class="btn" style="width:auto;padding:12px 18px">Добавить</button>
      </form>
      <div id="worktypes-list"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <img id="modal-img" alt="Фото">
    <button class="modal-close" id="modal-close">✕</button>
  </div>

  <script src="js/db.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
